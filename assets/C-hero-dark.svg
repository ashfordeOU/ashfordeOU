<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Ashforde">
<defs>
  <radialGradient id="halod" cx=".5" cy=".5" r=".5">
    <stop offset="0"  stop-color="#4D8DFF" stop-opacity=".10"/>
    <stop offset="1"  stop-color="#4D8DFF" stop-opacity="0"/>
  </radialGradient>
  <style>
    
    .bd0{transform-origin:218px 170px;animation:spd 26s linear infinite;animation-delay:0.0s;}
    .bd1{transform-origin:218px 170px;animation:spd 41s linear infinite;animation-delay:-15.6s;}
    .bd2{transform-origin:218px 170px;animation:spd 62s linear infinite;animation-delay:-44.0s;}
    @keyframes spd{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.bd0,.bd1,.bd2{animation:none}}
  </style>
</defs>
<rect width="880" height="340" fill="#080A0F"/>
<circle cx="218" cy="170" r="180" fill="url(#halod)"/>

<!-- orbital rings -->
<circle cx="218" cy="170" r="66" fill="none" stroke="#1C2230" stroke-width="1"/><circle cx="218" cy="170" r="104" fill="none" stroke="#1C2230" stroke-width="1"/><circle cx="218" cy="170" r="146" fill="none" stroke="#1C2230" stroke-width="1"/>
<circle cx="218" cy="170" r="104" fill="none" stroke="#4D8DFF" stroke-width="1" stroke-dasharray="2 6" opacity=".5"/>

<!-- central body -->
<circle cx="218" cy="170" r="21" fill="#EEF2F8"/>
<circle cx="218" cy="170" r="29" fill="none" stroke="#EEF2F8" stroke-width=".75" opacity=".28"/>

<!-- orbiting bodies -->

<g class="bd0">
  <circle cx="284" cy="170" r="7" fill="#4D8DFF"/>
  <circle cx="284" cy="170" r="12" fill="none" stroke="#4D8DFF" stroke-width=".75" opacity=".35"/>
</g>
<g class="bd1">
  <circle cx="322" cy="170" r="9" fill="#4D8DFF"/>
  <circle cx="322" cy="170" r="14" fill="none" stroke="#4D8DFF" stroke-width=".75" opacity=".35"/>
</g>
<g class="bd2">
  <circle cx="364" cy="170" r="6" fill="#4D8DFF"/>
  <circle cx="364" cy="170" r="11" fill="none" stroke="#4D8DFF" stroke-width=".75" opacity=".35"/>
</g>

<!-- wordmark + copy -->
<g transform="translate(452,0)">
  <text x="0" y="86"  font-family="'Avenir Next',Avenir,'Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="5.5" fill="#5B6474">SPACE · LAW · FINANCE</text>
  <text x="0" y="140" font-family="'Avenir Next',Avenir,'Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="47" font-weight="300" letter-spacing="2" fill="#EEF2F8">Ashforde<tspan font-size="17" dy="-19" fill="#4D8DFF">™</tspan></text>
  <path d="M0 162h58" stroke="#4D8DFF" stroke-width="2.5"/>
  <text x="0" y="196" font-family="'Avenir Next',Avenir,'Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#98A2B3">For the missions that cannot fail. Sovereign,</text>
  <text x="0" y="218" font-family="'Avenir Next',Avenir,'Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#98A2B3">high-assurance systems where error is unaffordable.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing=".6">
    
    <circle cx="4" cy="248" r="3.5" fill="#4D8DFF"/>
    <text x="18" y="252" fill="#EEF2F8" font-weight="600">KSHANA</text>
    <text x="112" y="252" fill="#5B6474">PNT-resilience simulator</text>
    <circle cx="4" cy="272" r="3.5" fill="#4D8DFF"/>
    <text x="18" y="276" fill="#EEF2F8" font-weight="600">GRASP</text>
    <text x="112" y="276" fill="#5B6474">Code architecture intelligence</text>
    <circle cx="4" cy="296" r="3.5" fill="#4D8DFF"/>
    <text x="18" y="300" fill="#EEF2F8" font-weight="600">YANA·OPS</text>
    <text x="112" y="300" fill="#5B6474">Vendor-neutral mission-ops standard</text>
  </g>
</g>
</svg>